name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            channel:
                description: "preview publishes a prerelease with a -dev zip"
                type: choice
                default: stable
                options:
                    - stable
                    - preview

env:
    PNPM_VERSION: "10.33.2"

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec prettier --check .
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
            - run: node scripts/validate-manifests.mjs --strict
            - run: node scripts/validate-licenses.mjs
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: ruff / mypy / pytest (plain venv)
              run: |
                  python -m venv .venv
                  .venv/bin/pip install ruff==0.16.8 mypy==2.3.1 pytest
                  .venv/bin/ruff format --check backend main.py
                  .venv/bin/ruff check .
                  .venv/bin/mypy
                  .venv/bin/pytest tests/backend

    package:
        needs: gates
        runs-on: ubuntu-latest
        outputs:
            prerelease: ${{ steps.meta.outputs.prerelease }}
        steps:
            - uses: actions/checkout@v4
            - name: Determine channel
              id: meta
              run: |
                  PRERELEASE=false
                  case "$GITHUB_REF_NAME" in
                      *-pre.* | *-rc*) PRERELEASE=true ;;
                  esac
                  if [ "${{ inputs.channel }}" = "preview" ]; then
                      PRERELEASE=true
                  fi
                  echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "Building prerelease=$PRERELEASE"
            - name: Toolchain build in the Decky builder image
              run: |
                  mkdir -p "$RUNNER_TEMP/builder-out"
                  docker run --rm \
                      -v "$GITHUB_WORKSPACE:/plugin" \
                      -v "$RUNNER_TEMP/builder-out:/out" \
                      ghcr.io/steamdeckhomebrew/builder:latest
            - name: Build release zips + SHA256 checksums
              run: |
                  DEV_FLAG=""
                  if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
                      DEV_FLAG="--dev"
                  fi
                  node scripts/build-package.mjs \
                      --src "$RUNNER_TEMP/builder-out" \
                      --out .tmp/release $DEV_FLAG
                  cat .tmp/release/SHA256SUMS.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: release-packages
                  path: .tmp/release/
                  if-no-files-found: error

    validate:
        needs: package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: release-packages
                  path: release-packages
            - name: Validate package structure
              run: |
                  set -euo pipefail
                  ls -la release-packages
                  status=0
                  for zip in release-packages/*.zip; do
                      node scripts/validate-package.mjs "$zip" || status=1
                  done
                  exit $status

    github-release:
        needs: [package, validate]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: release-packages
                  path: release-packages
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRERELEASE: ${{ needs.package.outputs.prerelease }}
              run: |
                  set -euo pipefail
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      TAG="$GITHUB_REF_NAME"
                      TARGET_ARGS=""
                  else
                      TAG="v$(node -p "require('./package.json').version")"
                      TARGET_ARGS="--target $GITHUB_SHA"
                  fi
                  FLAGS=""
                  if [ "$PRERELEASE" = "true" ]; then
                      FLAGS="--prerelease"
                  fi
                  VERSION="$(node -p "require('./package.json').version")"
                  cat > release-notes.md <<NOTES
                  Automated release of SpeechToDeck v$VERSION (commit $GITHUB_SHA).

                  Packages: the plugin zip (plus a `-dev` zip for preview builds)
                  and `SHA256SUMS.txt` with SHA-256 checksums of every archive.

                  Store distribution is a separate review flow: a pull request
                  to the decky-plugin-database repository with a review
                  checklist completed by the plugin author. GitHub releases are
                  URL-install artifacts, not store uploads.
                  NOTES
                  gh release create "$TAG" release-packages/* $FLAGS $TARGET_ARGS \
                      --title "SpeechToDeck v$VERSION" \
                      --notes-file release-notes.md

    store-pr:
        needs: [package, validate, github-release]
        if: vars.STORE_PR_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check store PR prerequisites
              id: prereq
              env:
                  DB_PR_PAT: ${{ secrets.DB_PR_PAT }}
              run: |
                  if [ -z "$DB_PR_PAT" ]; then
                      echo "::notice::DB_PR_PAT is not configured; skipping the store PR."
                      echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Open decky-plugin-database PR from the fork
              if: steps.prereq.outputs.present == 'true'
              env:
                  DB_PR_PAT: ${{ secrets.DB_PR_PAT }}
                  DB_FORK_REPO: ${{ vars.DB_FORK_REPO }}
                  COMMIT: ${{ github.sha }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  PLUGIN_NAME="$(node -p 'JSON.parse(require("fs").readFileSync("plugin.json", "utf8")).name')"
                  DESCRIPTION="$(node -p 'JSON.parse(require("fs").readFileSync("plugin.json", "utf8")).publish.description')"
                  VERSION="$(node -p "require('./package.json').version")"
                  SUBMODULE="plugins/$PLUGIN_NAME"
                  FORK_OWNER="${DB_FORK_REPO%%/*}"
                  BRANCH="release/$(echo "$PLUGIN_NAME" | tr '[:upper:] ' '[:lower:]-')-$VERSION"

                  git clone "https://x-access-token:${DB_PR_PAT}@github.com/${DB_FORK_REPO}.git" db
                  git -C db config user.name "speechtodeck-release-bot"
                  git -C db config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git -C db checkout -b "$BRANCH"

                  ADDITION=true
                  if git -C db cat-file -e "HEAD:$SUBMODULE" 2>/dev/null; then
                      ADDITION=false
                      git -C db submodule update --init "$SUBMODULE"
                  else
                      git -C db submodule add "https://github.com/${REPO}.git" "$SUBMODULE"
                  fi
                  git -C "db/$SUBMODULE" fetch --depth 1 origin "$COMMIT"
                  git -C "db/$SUBMODULE" checkout --detach "$COMMIT"
                  git -C db add "$SUBMODULE"
                  git -C db add .gitmodules 2>/dev/null || true

                  if [ "$ADDITION" = "true" ]; then
                      TITLE="Plugin addition: $PLUGIN_NAME v$VERSION"
                  else
                      TITLE="Plugin update: $PLUGIN_NAME v$VERSION"
                  fi
                  cat > pr-body.md <<BODY
                  ## $TITLE

                  **Plugin repository:** https://github.com/${REPO}
                  **Submodule:** \`$SUBMODULE @ $COMMIT\`
                  **Version:** $VERSION (package.json, semver)

                  ### Description

                  $DESCRIPTION

                  ### AUTHOR REVIEW REQUIRED — automation completed nothing below

                  > This pull request was opened by the plugin's release
                  > automation. The items below are deliberately NOT filled in:
                  > the plugin author must verify and complete each one before
                  > maintainers are asked to review. Automation makes no
                  > declarations on the author's behalf.

                  - [ ] **Generative AI declaration:** the
                        decky-plugin-database submission asks whether generative
                        AI was used in developing the plugin. **This automation
                        does not answer that question** — the author must state
                        it here truthfully before requesting review.
                  - [ ] **Icon / screenshot URL:** \`plugin.json\`
                        \`publish.image\` must point at a hosted, accessible
                        image before submission.
                  - [ ] **SteamOS Stable and Beta testing:** the author must
                        install this build on both SteamOS channels and declare
                        the results honestly. No testing is claimed here.
                  - [ ] **defaults.txt:** confirm the repository-root
                        \`defaults.txt\` documents every defaults file shipped
                        in the package.

                  ### Maintainer checklist (left for maintainer review)

                  - [ ] decky-plugin-database CI build passes
                  - [ ] Store rules and metadata review
                  BODY

                  git -C db commit -m "$TITLE"
                  git -C db push origin "$BRANCH"
                  GH_TOKEN="$DB_PR_PAT" gh pr create \
                      -R SteamDeckHomebrew/decky-plugin-database \
                      --head "$FORK_OWNER:$BRANCH" \
                      --title "$TITLE" \
                      --body-file pr-body.md
