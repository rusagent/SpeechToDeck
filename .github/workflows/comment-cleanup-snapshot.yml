name: Comment cleanup source snapshot

on:
    push:
        branches: [chore/comment-cleanup-20260921]
        paths: [.github/workflows/comment-cleanup-snapshot.yml]

permissions:
    contents: read

jobs:
    snapshot:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: f37f4cb63860bdb29813feddf94576358fe389ed
                  persist-credentials: false
            - name: Archive tracked source
              run: |
                  git archive --format=zip --output="$RUNNER_TEMP/speech-to-deck-source.zip" HEAD
                  git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-inventory.txt"
                  git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
            - uses: actions/upload-artifact@v4
              with:
                  name: comment-cleanup-source
                  retention-days: 1
                  path: |
                      ${{ runner.temp }}/speech-to-deck-source.zip
                      ${{ runner.temp }}/source-inventory.txt
                      ${{ runner.temp }}/source-commit.txt
