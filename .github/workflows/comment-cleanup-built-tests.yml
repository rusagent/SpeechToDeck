name: Verify cleaned source after bundle build

on:
    push:
        branches: [chore/comment-cleanup-20260921]
        paths: [.github/workflows/comment-cleanup-built-tests.yml]

permissions:
    contents: read

jobs:
    built-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: a1c84d6a8af06dcb44e7ecbf1cb850d8597444f8
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
              with:
                  version: "10.33.2"
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Run all tests with the bundle present
              env:
                  NO_COLOR: "1"
              run: |
                  set -euo pipefail
                  pnpm test 2>&1 | tee "$RUNNER_TEMP/post-build-tests.log"
                  git rev-parse HEAD > "$RUNNER_TEMP/tested-commit.txt"
                  git rev-parse HEAD^{tree} > "$RUNNER_TEMP/tested-tree.txt"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: comment-cleanup-post-build-tests
                  retention-days: 7
                  path: |
                      ${{ runner.temp }}/post-build-tests.log
                      ${{ runner.temp }}/tested-commit.txt
                      ${{ runner.temp }}/tested-tree.txt
