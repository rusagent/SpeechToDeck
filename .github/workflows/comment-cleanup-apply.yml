name: Apply reviewed comment cleanup

on:
    push:
        branches: [chore/comment-cleanup-20260921]
        paths:
            - .github/workflows/comment-cleanup-apply.yml
            - .comment-cleanup/**

permissions:
    contents: write

jobs:
    cleanup:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: "10.33.2"
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install validation tools
              run: |
                  pnpm install --frozen-lockfile
                  pip install ruff==0.16.8 mypy==2.3.1 pyyaml pytest
            - name: Apply syntax-aware cleanup
              env:
                  TYPESCRIPT_PATH: ${{ github.workspace }}/node_modules/typescript
                  JS_REPORT: ${{ runner.temp }}/comment-cleanup-js.json
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/cleanup-tools"
                  cp .comment-cleanup/* "$RUNNER_TEMP/cleanup-tools/"
                  node .comment-cleanup/cleanup-js.cjs
                  python .comment-cleanup/cleanup.py "$RUNNER_TEMP/comment-cleanup-python.json"
                  rm -rf .comment-cleanup
                  rm .github/workflows/comment-cleanup-snapshot.yml .github/workflows/comment-cleanup-apply.yml
                  ruff check --select I --fix backend main.py tests/backend
                  ruff format backend main.py tests/backend/conftest.py
                  pnpm exec prettier --write .
                  git add -A
            - name: Validate static gates
              run: |
                  set -euo pipefail
                  pnpm typecheck
                  pnpm lint
                  pnpm exec prettier --check .
                  ruff format --check backend main.py
                  ruff check .
                  mypy
                  node scripts/validate-manifests.mjs
                  node scripts/validate-licenses.mjs
                  git diff --cached --check
            - name: Verify comment-free sources
              env:
                  TYPESCRIPT_PATH: ${{ github.workspace }}/node_modules/typescript
                  JS_REPORT: ${{ runner.temp }}/comment-cleanup-final-js.json
              run: |
                  node "$RUNNER_TEMP/cleanup-tools/cleanup-js.cjs"
                  python - <<'PY'
                  import ast, io, json, subprocess, tokenize
                  from pathlib import Path
                  paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
                  count = 0
                  for name in paths:
                      if not name.endswith('.py'):
                          continue
                      text = Path(name).read_text()
                      assert not any(t.type == tokenize.COMMENT for t in tokenize.generate_tokens(io.StringIO(text).readline)), name
                      tree = ast.parse(text)
                      for node in ast.walk(tree):
                          if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                              assert ast.get_docstring(node) is None, name
                      count += 1
                  print(json.dumps({'tracked_files': len(paths), 'python_files': count, 'comments': 0, 'docstrings': 0}))
                  PY
                  git diff --exit-code
            - name: Commit cleanup to review branch
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit -m 'refactor: remove repository comments and document conventions'
                  git push origin HEAD:chore/comment-cleanup-20260921
                  git rev-parse HEAD > "$RUNNER_TEMP/cleanup-commit.txt"
            - name: Archive reviewed source and patch
              if: always()
              run: |
                  mkdir -p "$RUNNER_TEMP/cleanup-result"
                  git diff f37f4cb63860bdb29813feddf94576358fe389ed > "$RUNNER_TEMP/cleanup-result/SpeechToDeck-comment-cleanup.patch"
                  git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/cleanup-result/SpeechToDeck-comment-cleanup.tar.gz"
                  cp "$RUNNER_TEMP"/comment-cleanup-*.json "$RUNNER_TEMP/cleanup-result/" 2>/dev/null || true
                  cp "$RUNNER_TEMP/cleanup-commit.txt" "$RUNNER_TEMP/cleanup-result/" 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: comment-cleanup-result
                  retention-days: 7
                  path: ${{ runner.temp }}/cleanup-result/
