[project]
name = "speechtodeck"
version = "0.1.0"
description = "Steam Deck plugin backend: local speech-to-text coordination for the SpeechToDeck plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]
include = ["backend/**/*.py", "tests/**/*.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "main.py"]
ignore_missing_imports = false

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/backend/conftest.py" = ["E402"]

[[tool.mypy.overrides]]
module = ["decky_plugin", "helpers"]
ignore_missing_imports = true
